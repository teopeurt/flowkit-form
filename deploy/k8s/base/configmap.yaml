apiVersion: v1
kind: ConfigMap
metadata:
  name: flowkitform-config
data:
  NODE_ENV: development
  FLOWKITFORM_PORT: "3011"
  FLOWKITFORM_ALLOW_SEED: "true"
  FLOWKITFORM_PERSISTENCE: "true"
  TEMPORAL_ADDRESS: temporal-frontend:7233
  TEMPORAL_NAMESPACE: flowkitform
  TEMPORAL_TASK_QUEUE: flowkitform
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: notifications@flowkitform.test
  MAILPIT_URL: https://mail.flowkit.k3s.naakwu.app
  BETTER_AUTH_URL: https://flowkit.k3s.naakwu.app
