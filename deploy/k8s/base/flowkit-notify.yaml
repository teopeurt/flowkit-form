apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowkit-notify
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowkit-notify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowkit-notify
        app.kubernetes.io/part-of: flowkitform
    spec:
      serviceAccountName: flowkitform
      imagePullSecrets:
        - name: flowkitform-registry
      containers:
        - name: flowkit-notify
          image: docker.pigstycoders.com/flowkitform-dev/flowkitform
          imagePullPolicy: Always
          command: ["bun", "run", "apps/notify-worker/src/delivery.worker.ts"]
          envFrom:
            - configMapRef:
                name: flowkitform-config
            - secretRef:
                name: flowkitform-runtime
