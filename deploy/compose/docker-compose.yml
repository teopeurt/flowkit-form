services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: flowkitform
      POSTGRES_USER: flowkitform
      POSTGRES_PASSWORD: flowkitform
    ports: ["${FLOWKITFORM_POSTGRES_PORT:-5441}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U flowkitform -d flowkitform"], interval: 2s, timeout: 2s, retries: 20 }
    volumes: [flowkitform_postgres:/var/lib/postgresql/data]
  temporal:
    image: temporalio/auto-setup:1.26.2
    environment: { DB: postgres12, DB_PORT: "5432", POSTGRES_USER: flowkitform, POSTGRES_PWD: flowkitform, POSTGRES_SEEDS: postgres }
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["${FLOWKITFORM_TEMPORAL_PORT:-7233}:7233"]
  temporal-namespace:
    image: temporalio/admin-tools:1.26.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on: { temporal: { condition: service_started } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'until temporal operator namespace describe --namespace flowkitform >/dev/null 2>&1; do temporal operator namespace create --namespace flowkitform >/dev/null 2>&1 || true; sleep 2; done'
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports: ["${FLOWKITFORM_MAILPIT_HTTP_PORT:-8025}:8025", "${FLOWKITFORM_MAILPIT_SMTP_PORT:-1025}:1025"]
  migration:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      FLOWKITFORM_ALLOW_SEED: "true"
      FLOWKITFORM_MIGRATION_APPROVED: "true"
      DATABASE_URL: postgresql://flowkitform:flowkitform@postgres:5432/flowkitform
      BETTER_AUTH_SECRET: flowkitform-compose-secret-change-me-32chars
    depends_on: { postgres: { condition: service_healthy } }
    command: ["bun", "run", "db:migrate"]
  seed:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      FLOWKITFORM_ALLOW_SEED: "true"
      DATABASE_URL: postgresql://flowkitform:flowkitform@postgres:5432/flowkitform
      BETTER_AUTH_SECRET: flowkitform-compose-secret-change-me-32chars
    depends_on: { migration: { condition: service_completed_successfully } }
    command: ["bun", "run", "db:seed"]
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      FLOWKITFORM_ALLOW_SEED: "true"
      FLOWKITFORM_PERSISTENCE: "true"
      DATABASE_URL: postgresql://flowkitform:flowkitform@postgres:5432/flowkitform
      BETTER_AUTH_SECRET: flowkitform-compose-secret-change-me-32chars
      BETTER_AUTH_URL: ${FLOWKITFORM_WEB_URL:-http://localhost:3012}
      MAILPIT_URL: ${FLOWKITFORM_MAILPIT_URL:-http://localhost:8025}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: flowkitform
      TEMPORAL_TASK_QUEUE: flowkitform
    depends_on: { seed: { condition: service_completed_successfully }, temporal-namespace: { condition: service_completed_successfully } }
    ports: ["${FLOWKITFORM_API_PORT:-3011}:3011"]
    command: ["bun", "run", "apps/api/src/main.ts"]
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    depends_on: { api: { condition: service_started } }
    ports: ["${FLOWKITFORM_WEB_PORT:-3012}:8080"]
  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      FLOWKITFORM_PERSISTENCE: "true"
      DATABASE_URL: postgresql://flowkitform:flowkitform@postgres:5432/flowkitform
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: flowkitform
      TEMPORAL_TASK_QUEUE: flowkitform
      BETTER_AUTH_SECRET: flowkitform-compose-secret-change-me-32chars
    depends_on: { seed: { condition: service_completed_successfully }, temporal-namespace: { condition: service_completed_successfully } }
    command: ["bun", "run", "apps/worker/src/main.ts"]
  notify:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      FLOWKITFORM_PERSISTENCE: "true"
      DATABASE_URL: postgresql://flowkitform:flowkitform@postgres:5432/flowkitform
      BETTER_AUTH_SECRET: flowkitform-compose-secret-change-me-32chars
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on: { seed: { condition: service_completed_successfully }, api: { condition: service_started }, mailpit: { condition: service_started } }
    restart: unless-stopped
    command: ["bun", "run", "apps/notify-worker/src/delivery.worker.ts"]
volumes:
  flowkitform_postgres:
